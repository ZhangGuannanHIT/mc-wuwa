plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://repo.redlance.org/public' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups('com.geckolib') }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        mc_wuwa { sourceSet sourceSets.main }
    }
}

dependencies {
    // Minecraft pins Gson/Netty/JOML/SLF4J. PAL's published newer transitive versions
    // conflict with that platform; both PAL artifacts use the game's provided libraries.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") { transitive = false }
    jarJar(implementation('com.zigythebird.playeranim:PlayerAnimationLibCore') { transitive = false }) {
        version { strictly "[${pal_version}]"; prefer pal_version }
    }
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources {
    exclude '**/*.bbmodel', '**/__pycache__/**'
}
// The native mesh regression helpers also compile against the pinned game API.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
